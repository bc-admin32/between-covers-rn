plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.admpush'
version = '1.0.0'

// Local file: dependency — never published anywhere, so the plugin's default
// Maven-publishing setup is both unnecessary and broken here: it hardcodes a
// lookup of a SoftwareComponent literally named "release"
// (expo-module-gradle-plugin's ProjectConfiguration.kt / PublicationInfo),
// which doesn't exist once flavorDimensions/productFlavors are declared below
// (AGP produces amazonRelease/googlePlayRelease instead). canBePublished is
// the plugin's own supported opt-out for exactly this case — no other module
// in this repo needs it because none of them declare product flavors.
expoModule {
  canBePublished = false
}

android {
  namespace "expo.modules.admpush"

  // Same dimension + flavor names as android/app/build.gradle (set by
  // react-native-iap's config plugin, paymentProvider: "both" — verified
  // against node_modules/react-native-iap/plugin/build/withIAP.js). Matching
  // names means Gradle aligns this module's `amazon` variant to :app's
  // `amazon` variant directly, no missingDimensionStrategy needed.
  flavorDimensions "appstore"
  productFlavors {
    googlePlay { dimension "appstore" }
    amazon     { dimension "appstore" }
  }

  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ADM SDK isn't on Maven Central — download from the Amazon Developer
  // Console and place at modules/adm-push/android/libs/amazon-device-messaging.jar
  // (see modules/adm-push/README.md). amazonImplementation scopes it to the
  // amazon variant only — the googlePlay build never touches this dependency.
  amazonImplementation files('libs/amazon-device-messaging.jar')

  // NotificationCompat/NotificationManagerCompat/ContextCompat, used by
  // AdmNotificationDisplay.kt (src/amazon only) to render received ADM
  // messages. Each Android Gradle module resolves its own compile classpath
  // independently — this isn't inherited from :app just because the app
  // already depends on it elsewhere. Version matches node_modules/expo-notifications/
  // android/build.gradle's own androidx.core dependency for consistency;
  // Gradle's normal conflict resolution picks the highest version requested
  // anywhere in the app graph regardless, so this only sets a floor.
  amazonImplementation 'androidx.core:core:1.6.0'
}
